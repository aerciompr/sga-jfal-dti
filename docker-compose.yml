name: sga-jfal
x-app: &app
  build: .
  image: sga-jfal:${SGA_RELEASE:-local}
  environment: &app-env
    DB_HOST: db
    DB_PORT: 3306
    DB_USER: ${DB_USER:-sga}
    DB_PASS: ${DB_PASS:?Defina DB_PASS no .env}
    DB_NAME: ${DB_NAME:-justica_senhas}
    SYS_NAME: ${SYS_NAME:-Justiça Federal}
    SESSION_SECURE: ${SESSION_SECURE:-1}
    TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
  networks: [sga_internal]
  depends_on:
    db:
      condition: service_healthy
services:
  web:
    <<: *app
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8085}:3020"
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 2
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    volumes:
      - php_sessions:/var/lib/php/sessions
  migrate:
    <<: *app
    profiles: [tools]
    environment:
      <<: *app-env
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
      RUNTIME_DB_USER: ${DB_USER:-sga}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    command: [php, /var/www/html/scripts/migrate.php]
    restart: "no"
  db:
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${DB_NAME:-justica_senhas}
      MYSQL_USER: ${DB_USER:-sga}
      MYSQL_PASSWORD: ${DB_PASS:?Defina DB_PASS no .env}
    volumes:
      - db_data:/var/lib/mysql
    networks: [sga_internal]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
volumes:
  db_data:
  php_sessions:
networks:
  sga_internal:
